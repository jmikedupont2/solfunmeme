[package]
name = "solfunmeme_distributed"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
libp2p = { version = "0.54", features = ["tcp", "tokio", "mdns", "noise", "yamux", "gossipsub", "kad", "request-response", "cbor"] }
futures = "0.3"
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
