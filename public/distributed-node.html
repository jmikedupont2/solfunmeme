<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SOLFUNMEME Distributed Node</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        body { font-family: monospace; background: #000; color: #0f0; padding: 20px; }
        #output { border: 1px solid #0f0; padding: 10px; height: 400px; overflow-y: scroll; }
        button { background: #0f0; color: #000; border: none; padding: 10px; margin: 5px; cursor: pointer; }
        input { background: #111; color: #0f0; border: 1px solid #0f0; padding: 5px; width: 300px; }
        .stats { color: #ff0; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🕳️💎 SOLFUNMEME Distributed Node (WASM)</h1>
    
    <div class="stats" id="stats">Initializing...</div>
    
    <div>
        <input id="account" placeholder="Account address" value="BwUTq7fS6sfUmHDwAiCQZ3asSiPEapW5zDrsbwtapump">
        <button onclick="fetchSignatures()">Get Signatures</button>
        <button onclick="clearCache()">Clear Cache</button>
    </div>
    
    <div id="output"></div>

    <script type="module">
        import init, { WasmNode } from './pkg/solfunmeme_distributed.js';
        
        let node;
        
        async function start() {
            await init();
            
            // Check for invite code in URL
            const params = new URLSearchParams(window.location.search);
            if (params.has('rpcs')) {
                const emoji = params.get('emoji') || '???';
                log(`📨 Loading invite code: ${emoji}`);
                
                try {
                    const rpcsB64 = params.get('rpcs');
                    const rpcsJson = atob(rpcsB64);
                    const rpcs = JSON.parse(rpcsJson);
                    log(`✓ Loaded ${rpcs.length} RPCs from invite`);
                    
                    // Store for WASM to use
                    localStorage.setItem('rpc_endpoints', JSON.stringify(rpcs));
                } catch (e) {
                    log(`⚠ Failed to parse invite: ${e.message}`);
                }
            }
            
            node = new WasmNode();
            window.node = node;
            log('✓ Node ready');
            
            // Load from pastebin trackers
            await loadTrackers();
            
            // Discover RPC nodes
            log('🔍 Discovering RPC nodes...');
            try {
                const result = await node.discover_nodes();
                log(`✓ ${result}`);
            } catch (e) {
                log(`⚠ Discovery failed: ${e}`);
            }
            
            updateStats();
        }
        
        window.fetchSignatures = async function() {
            const account = document.getElementById('account').value;
            log(`→ Fetching signatures for ${account.slice(0, 20)}...`);
            
            try {
                const result = await node.fetch_rpc(
                    'getSignaturesForAddress',
                    JSON.stringify([account, {limit: 10}])
                );
                const data = JSON.parse(result);
                log(`✓ Got ${data.result?.length || 0} signatures`);
                updateStats();
            } catch(e) {
                log(`✗ Error: ${e}`);
            }
        };
        
        window.clearCache = function() {
            localStorage.clear();
            log('✓ Cache cleared');
        };
        
        // Pastebin tracker loader
        const TRACKER_URLS = [
            // Add your pastebin URLs here
            // 'https://pastebin.com/raw/XXXXXXXX',
        ];
        
        async function loadTrackers() {
            if (TRACKER_URLS.length === 0) {
                log('ℹ No trackers configured');
                return;
            }
            
            log('📡 Loading pastebin trackers...');
            let totalPeers = 0;
            
            for (const url of TRACKER_URLS) {
                try {
                    const resp = await fetch(url);
                    const data = await resp.json();
                    
                    log(`✓ Tracker: ${data.peers.length} peers`);
                    totalPeers += data.peers.length;
                    
                    // Merge RPC endpoints
                    for (const peer of data.peers) {
                        log(`  ${peer.emoji}: ${peer.rpcs.length} RPCs`);
                        
                        // Store peer RPCs
                        const key = `peer_${peer.peer_id}`;
                        localStorage.setItem(key, JSON.stringify(peer.rpcs));
                    }
                } catch (e) {
                    log(`✗ Tracker failed: ${url.slice(0, 40)}...`);
                }
            }
            
            if (totalPeers > 0) {
                log(`✓ Loaded ${totalPeers} peers from trackers`);
            }
        }
        
        function log(msg) {
            const output = document.getElementById('output');
            output.innerHTML += `${new Date().toLocaleTimeString()} ${msg}<br>`;
            output.scrollTop = output.scrollHeight;
        }
        
        function updateStats() {
            document.getElementById('stats').textContent = node.get_stats();
        }
        
        window.log = log;
        start();
    </script>
</body>
</html>
