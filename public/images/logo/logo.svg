<?xml version="1.0" encoding="UTF-8"?>
<svg width="400px" height="400px" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <title>SOLFUNMEME Logo</title>
  
  <rect x="0" y="0" width="400" height="400" fill="#230052"/>
  
  <defs>
    <!-- Rainbow radial gradient for iris -->
    <radialGradient id="rainbowIris" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="20%" stop-color="#00FF41"/>
      <stop offset="40%" stop-color="#00FFFF"/>
      <stop offset="60%" stop-color="#DC143C"/>
      <stop offset="80%" stop-color="#00FFFF"/>
      <stop offset="100%" stop-color="#00FF41"/>
    </radialGradient>
    
    <!-- Single ray for starburst -->
    <g id="ray">
      <line x1="0" y1="0" x2="0" y2="-75" stroke="#00FFFF" stroke-width="3" opacity="0.8"/>
      <line x1="0" y1="0" x2="0" y2="-85" stroke="#FFD700" stroke-width="1" opacity="0.9"/>
    </g>
    
    <!-- Petal shape -->
    <ellipse id="petalBase" rx="100" ry="200" fill="#DC143C"/>
    <ellipse id="petalInner" rx="85" ry="175" fill="#FF1744"/>
  </defs>
  
  <!-- Layered red petals (rotated for flower effect) -->
  <g transform="translate(200,200)">
    <!-- Outer layer -->
    <use xlink:href="#petalBase" transform="rotate(0)"/>
    <use xlink:href="#petalBase" transform="rotate(45)"/>
    <use xlink:href="#petalBase" transform="rotate(90)"/>
    <use xlink:href="#petalBase" transform="rotate(135)"/>
    <use xlink:href="#petalBase" transform="rotate(180)"/>
    <use xlink:href="#petalBase" transform="rotate(225)"/>
    <use xlink:href="#petalBase" transform="rotate(270)"/>
    <use xlink:href="#petalBase" transform="rotate(315)"/>
    
    <!-- Inner layer (slightly brighter) -->
    <use xlink:href="#petalInner" transform="rotate(22.5)"/>
    <use xlink:href="#petalInner" transform="rotate(67.5)"/>
    <use xlink:href="#petalInner" transform="rotate(112.5)"/>
    <use xlink:href="#petalInner" transform="rotate(157.5)"/>
    <use xlink:href="#petalInner" transform="rotate(202.5)"/>
    <use xlink:href="#petalInner" transform="rotate(247.5)"/>
    <use xlink:href="#petalInner" transform="rotate(292.5)"/>
    <use xlink:href="#petalInner" transform="rotate(337.5)"/>
  </g>
  
  <!-- Central eye -->
  <g transform="translate(200,200)">
    <circle r="95" fill="#DC143C"/>
    <circle r="80" fill="url(#rainbowIris)"/>
    <circle r="35" fill="#230052"/>
    <circle cx="12" cy="-12" r="12" fill="#F5F5DC" opacity="0.9"/>
    
    <!-- Starburst rays -->
    <use xlink:href="#ray" transform="rotate(0)"/>
    <use xlink:href="#ray" transform="rotate(15)"/>
    <use xlink:href="#ray" transform="rotate(30)"/>
    <use xlink:href="#ray" transform="rotate(45)"/>
    <use xlink:href="#ray" transform="rotate(60)"/>
    <use xlink:href="#ray" transform="rotate(75)"/>
    <use xlink:href="#ray" transform="rotate(90)"/>
    <use xlink:href="#ray" transform="rotate(105)"/>
    <use xlink:href="#ray" transform="rotate(120)"/>
    <use xlink:href="#ray" transform="rotate(135)"/>
    <use xlink:href="#ray" transform="rotate(150)"/>
    <use xlink:href="#ray" transform="rotate(165)"/>
    <use xlink:href="#ray" transform="rotate(180)"/>
    <use xlink:href="#ray" transform="rotate(195)"/>
    <use xlink:href="#ray" transform="rotate(210)"/>
    <use xlink:href="#ray" transform="rotate(225)"/>
    <use xlink:href="#ray" transform="rotate(240)"/>
    <use xlink:href="#ray" transform="rotate(255)"/>
    <use xlink:href="#ray" transform="rotate(270)"/>
    <use xlink:href="#ray" transform="rotate(285)"/>
    <use xlink:href="#ray" transform="rotate(300)"/>
    <use xlink:href="#ray" transform="rotate(315)"/>
    <use xlink:href="#ray" transform="rotate(330)"/>
    <use xlink:href="#ray" transform="rotate(345)"/>
  </g>
  
  <!-- Golden symbol above eye -->
  <g transform="translate(200,130)">
    <circle cx="0" cy="0" r="9" fill="#FFD700"/>
    <circle cx="0" cy="45" r="9" fill="#FFD700"/>
    <circle cx="35" cy="22.5" r="9" fill="#FFD700"/>
    <circle cx="-35" cy="22.5" r="9" fill="#FFD700"/>
    
    <line x1="0" y1="0" x2="0" y2="45" stroke="#FFD700" stroke-width="5"/>
    <line x1="0" y1="0" x2="35" y2="22.5" stroke="#FFD700" stroke-width="5"/>
    <line x1="0" y1="0" x2="-35" y2="22.5" stroke="#FFD700" stroke-width="5"/>
    <line x1="35" y1="22.5" x2="0" y2="45" stroke="#FFD700" stroke-width="5"/>
    <line x1="-35" y1="22.5" x2="0" y2="45" stroke="#FFD700" stroke-width="5"/>
    <line x1="35" y1="22.5" x2="-35" y2="22.5" stroke="#FFD700" stroke-width="5"/>
  </g>
  
  <!-- Minimal curling tentacles (cream color) -->
  <path d="M200,80 Q130,150 120,200" fill="none" stroke="#F5F5DC" stroke-width="25" stroke-linecap="round" opacity="0.6"/>
  <path d="M200,80 Q270,150 280,200" fill="none" stroke="#F5F5DC" stroke-width="25" stroke-linecap="round" opacity="0.6"/>
</svg>
