name: Build Distributed Node

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows
          - os: ubuntu-latest
            target: aarch64-linux-android
            name: android

    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    
    - name: Setup Android NDK
      if: matrix.name == 'android'
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
        unzip -q android-ndk-r26d-linux.zip
        echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26d" >> $GITHUB_ENV
        mkdir -p ~/.cargo
        echo "[target.aarch64-linux-android]" >> ~/.cargo/config.toml
        echo "linker = \"$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang\"" >> ~/.cargo/config.toml
    
    - name: Build
      working-directory: distributed-node
      run: cargo build --release --target ${{ matrix.target }}
    
    - name: Package
      run: |
        mkdir release
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          cp distributed-node/target/${{ matrix.target }}/release/node.exe release/solfunmeme-node-${{ matrix.name }}.exe
        else
          cp distributed-node/target/${{ matrix.target }}/release/node release/solfunmeme-node-${{ matrix.name }}
          chmod +x release/solfunmeme-node-${{ matrix.name }}
        fi
      shell: bash
    
    - uses: actions/upload-artifact@v4
      with:
        name: solfunmeme-node-${{ matrix.name }}
        path: release/*
